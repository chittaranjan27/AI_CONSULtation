services:
  # ============================================
  # Web Application (Connected directly to Neon DB)
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brahma-graha-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Loads your existing .env file with your Neon DB connection string & API keys
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brahma_net

  # ============================================
  # Redis Cache & Queue
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: brahma-graha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - brahma_net

  # ============================================
  # Optional: Local Postgres Sandbox (profile: local-db)
  # Only starts if run with: docker compose --profile local-db up
  # ============================================
  postgres:
    profiles:
      - local-db
    image: postgres:16-alpine
    container_name: brahma-graha-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-brahma_graha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-brahma_graha}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - brahma_net

  adminer:
    profiles:
      - local-db
    image: adminer:latest
    container_name: brahma-graha-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - brahma_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  brahma_net:
    driver: bridge
